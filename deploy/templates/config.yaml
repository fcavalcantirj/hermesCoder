# hermesCoder — ~/.hermes/config.yaml (rendered by deploy/box-bootstrap.sh, owner-substituted).
# Only the keys that differ from Hermes' defaults live here; every other key keeps the
# engine default (`hermes config get <key>` prints the live value, `hermes doctor` validates).

model:
  # Official Nous plugin-catalog provider: your Claude Pro/Max subscription through the
  # official Claude Code CLI (`claude`), no API key, no per-token bill. Hermes keeps its
  # own loop, tools, approvals and compaction. Billed against the subscription's Agent SDK
  # allowance (~1.7x the interactive TUI rate — plugin README).
  provider: claude-subscription-directsdk-experimental
  # Pinned routes: opus (Opus 5.5 [1m]) | sonnet (Sonnet 5.5 [1m]) | haiku | fable, or an
  # explicit id such as claude-opus-4-8 (Opus 4.8 [1m]).
  default: opus

providers:
  claude-subscription-directsdk-experimental:
    # Bounds a native call that hangs without output (plugin README, "stale timeout").
    stale_timeout_seconds: 900

# Hermes-native MCP servers (the plugin disables Claude Code's own MCP/settings, so
# everything the agent needs is declared HERE, not in ~/.claude.json).
mcp_servers:
  zvec-memory:
    command: "__HOME__/zvec-memory/venv/bin/python"
    args: ["__HOME__/zvec-memory/zvec_memory_server.py"]

memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
  flush_min_turns: 6

compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_first_n: 3
  protect_last_n: 20

session_reset:
  mode: both
  idle_minutes: 1440
  at_hour: 4

agent:
  max_turns: 60
  reasoning_effort: medium

approvals:
  mode: smart          # smart | manual | off — flagged terminal commands get an LLM risk check

display:
  tool_progress: all
  interim_assistant_messages: true
  long_running_notifications: true
