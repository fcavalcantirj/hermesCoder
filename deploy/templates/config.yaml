# hermesCoder — ~/.hermes/config.yaml (rendered by deploy/box-bootstrap.sh, owner-substituted).
# Only the keys that differ from Hermes' defaults live here; every other key keeps the
# engine default (`hermes config get <key>` prints the live value, `hermes doctor` validates).

model:
  # Official Nous plugin-catalog provider: your Claude Pro/Max subscription through the
  # official Claude Code CLI (`claude`), no API key, no per-token bill. Hermes keeps its
  # own loop, tools, approvals and compaction. Billed against the subscription's Agent SDK
  # allowance (~1.7x the interactive TUI rate — plugin README).
  provider: claude-subscription-directsdk-experimental
  # Pinned routes: opus (Opus 5.5 [1m]) | sonnet (Sonnet 5.5 [1m]) | haiku | fable, or an
  # explicit id such as claude-opus-4-8 (Opus 4.8 [1m]).
  default: opus

providers:
  claude-subscription-directsdk-experimental:
    # Bounds a native call that hangs without output (plugin README, "stale timeout").
    stale_timeout_seconds: 900

# Hermes-native MCP servers (the plugin disables Claude Code's own MCP/settings, so
# everything the agent needs is declared HERE, not in ~/.claude.json).
mcp_servers:
  zvec-memory:
    command: "__HOME__/zvec-memory/venv/bin/python"
    args: ["__HOME__/zvec-memory/zvec_memory_server.py"]

memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
  flush_min_turns: 6

compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_first_n: 3
  protect_last_n: 20

# session_reset: retired in Hermes 0.21 (gateway chats reset only on /new or /reset); the
# old idle/daily keys are no longer read. Want the 04:00 reset back? `hermes plugins install
# hermes-session-reset-policy`.

agent:
  # Per-turn API-call budget ("iteration N/M" in the busy ack). 0 = unlimited, the engine
  # default; a cap ENDS a long task with "Iteration budget exhausted". Runaway protection
  # stays elsewhere: gateway_timeout 1800 s / turn_liveness 600 s of NO activity, loop guardrails.
  max_turns: 0
  reasoning_effort: medium
  # Notice-only "I seem to be stuck" after this much silence while a follow-up is queued
  # (engine default 300 s fires during long agent rebuilds and lease waits — upstream #121030).
  session_stall_timeout: 900

delegation:
  # Per-subagent API-call budget (engine default 250; the model cannot raise it per call).
  # NOT 0 here: for children 0 means a zero budget, not unlimited.
  max_iterations: 250

timeouts:
  tools:
    # Wall-clock deadline for ONE tool call (engine default 420 s; terminal and browser_exec are
    # not exempt, so a 10-minute study or a 600 s command died at 7 min). 1800 = browser_exec's own max.
    sequential_call: 1800

approvals:
  mode: smart          # smart | manual | off — flagged terminal commands get an LLM risk check

display:
  tool_progress: all
  interim_assistant_messages: true
  long_running_notifications: true
  # A new message while a turn runs: steer = inject it into the running turn (falls back to
  # queue), never abort. The engine default `interrupt` kills a long task on a casual "waiting".
  busy_input_mode: steer
